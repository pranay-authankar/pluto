<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nearby Services | Pluto</title>
  <meta name="description" content="Explore essential student services near your college: food, grocery, pharmacy, stationery, ATM, laundry, and transport.">

  <!-- Core Design System -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/nearby.css">

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
</head>
<body class="app-shell" style="overflow: hidden;">

  <!-- ========================================================================
       TOP NAVIGATION BAR
       ======================================================================== -->
  <header class="site-header" style="position: relative; z-index: 1000;">
    <div class="container header-container">
      
      <!-- Brand Logo -->
      <a href="index.html" class="brand" aria-label="Pluto Home">
        <div class="brand-icon-wrapper">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">Pluto</span>
          <span class="brand-tag">Your World Away From Home.</span>
        </div>
      </a>

      <!-- Quick Nav Links -->
      <div class="header-actions">
        <a href="index.html" class="nav-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
          Home
        </a>
        <a href="rooms.html" class="nav-link">
          Rooms
        </a>
        <a href="food.html" class="nav-link">
          Food
        </a>
        <a href="roommates.html" class="nav-link">
          Partners
        </a>
      </div>

    </div>
  </header>

  <!-- ========================================================================
       MAP-FIRST IMMERSIVE CANVAS
       ======================================================================== -->
  <main class="nearby-viewport-shell">

    <!-- Floating Top Controls: Search + 7 Category Pill Selectors -->
    <div class="floating-map-controls">
      
      <!-- Simple Search for Custom Services -->
      <div class="nearby-search-pill">
        <div class="nearby-search-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" x2="16.65" y1="21" y2="16.65"></line>
          </svg>
        </div>
        <input 
          type="text" 
          id="nearbySearchInput" 
          class="nearby-search-input" 
          placeholder="Search nearby services..." 
          autocomplete="off"
          aria-label="Search nearby services"
        >
        <button type="button" class="nearby-clear-btn" id="nearbyClearBtn" aria-label="Clear search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </button>
      </div>

      <!-- Compact 7-Category Selector Pill Bar -->
      <nav class="category-pill-bar" aria-label="Nearby Categories">
        <button type="button" class="cat-btn active" data-cat="food">
          <span>🍲</span> Food
        </button>
        <button type="button" class="cat-btn" data-cat="grocery">
          <span>🛒</span> Grocery
        </button>
        <button type="button" class="cat-btn" data-cat="pharmacy">
          <span>💊</span> Pharmacy
        </button>
        <button type="button" class="cat-btn" data-cat="stationery">
          <span>✏️</span> Stationery
        </button>
        <button type="button" class="cat-btn" data-cat="atm">
          <span>💳</span> ATM
        </button>
        <button type="button" class="cat-btn" data-cat="laundry">
          <span>🧺</span> Laundry
        </button>
        <button type="button" class="cat-btn" data-cat="transport">
          <span>🚇</span> Transport
        </button>
      </nav>

    </div>

    <!-- Central College Floating Location Pill -->
    <div class="floating-campus-badge" id="floatingCampusBadge" title="Central Search Anchor">
      <span class="status-pulse"></span>
      <span id="campusBadgeName">UC Berkeley</span>
      <span style="color: var(--slate-400); font-weight: 400;">• Center</span>
    </div>

    <!-- Main Full-Width Interactive Map -->
    <div id="nearbyMap" role="region" aria-label="Nearby Services Interactive Map"></div>

  </main>

  <!-- Leaflet.js -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  
  <!-- Scripts -->
  <script src="js/design-system.js"></script>
  <script src="js/nearby.js"></script>
</body>
</html>
