<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recommendations | Pluto</title>
  <meta name="description" content="Visual Command Center with personalized room, food, partner, and nearby recommendations.">

  <!-- Core Design System -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/dashboard.css">

  <!-- Leaflet Map CSS (Clean & Open Source) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
</head>
<body class="app-shell" style="overflow: hidden;">

  <!-- ========================================================================
       TOP NAVIGATION BAR
       ======================================================================== -->
  <header class="site-header" style="position: relative; z-index: 1000;">
    <div class="container header-container">
      
      <!-- Brand Logo -->
      <a href="index.html" class="brand" aria-label="Pluto Home">
        <div class="brand-icon-wrapper">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">Pluto</span>
          <span class="brand-tag">Your World Away From Home.</span>
        </div>
      </a>

      <!-- Quick Controls -->
      <div class="header-actions">
        <a href="rooms.html" class="nav-link" title="Explore Student Rooms">
          Rooms
        </a>
        <a href="food.html" class="nav-link" title="Explore Student Food">
          Food
        </a>
        <a href="roommates.html" class="nav-link" title="Explore Room Partners">
          Partners
        </a>
        <a href="nearby.html" class="nav-link" title="Explore Nearby Services">
          Nearby
        </a>
        <a href="index.html" class="nav-link" title="Return to Home">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
          Home
        </a>
        <a href="requirements.html" class="nav-link" title="Edit Preferences">
          Preferences
        </a>
      </div>

    </div>
  </header>

  <!-- ========================================================================
       COMMAND CENTER DASHBOARD SHELL
       ======================================================================== -->
  <div class="dashboard-shell">
    
    <!-- Top Command Bar: College focal point & instant filters -->
    <div class="command-bar">
      
      <!-- Prominent College Identifier -->
      <div class="command-college-info">
        <div class="college-badge-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
          </svg>
        </div>
        <div>
          <div class="command-college-name" id="commandCollegeName">UC Berkeley</div>
          <div class="command-college-meta">Central Campus Focus • 4 Verified Matches</div>
        </div>
      </div>

      <!-- Simple Filter Pills: Budget, Distance, Type -->
      <div class="filter-bar">
        <!-- Filter 1: Type -->
        <select class="filter-select-pill" id="filterType" aria-label="Filter by Type">
          <option value="all">All Types</option>
          <option value="room">🏠 Rooms</option>
          <option value="food">🍱 Food</option>
          <option value="partner">🤝 Partner</option>
          <option value="nearby">📍 Nearby</option>
        </select>

        <!-- Filter 2: Budget -->
        <select class="filter-select-pill" id="filterBudget" aria-label="Filter by Budget">
          <option value="all">All Budgets</option>
          <option value="700">Under $700</option>
          <option value="800">Under $800</option>
        </select>

        <!-- Filter 3: Distance -->
        <select class="filter-select-pill" id="filterDistance" aria-label="Filter by Distance">
          <option value="all">All Distances</option>
          <option value="0.3">Within 0.3 km</option>
          <option value="0.5">Within 0.5 km</option>
        </select>
      </div>

    </div>

    <!-- Main Visual Split: Cards Sidebar + Large Interactive Map -->
    <div class="command-canvas">
      
      <!-- Left Sidebar: Compact Recommendation Cards -->
      <aside class="recs-sidebar" aria-label="Recommendations List">
        <div class="recs-header">
          <span class="recs-title">Curated Matches</span>
          <span class="badge badge-success" style="font-size: 0.65rem;">
            <span class="badge-dot"></span> Live Data
          </span>
        </div>

        <!-- Rendered dynamically by js/dashboard.js -->
        <div id="recommendationsList" style="display: flex; flex-direction: column; gap: var(--space-3);"></div>
      </aside>

      <!-- Right Main Viewport: Large Interactive Map -->
      <main class="map-viewport-container">
        
        <!-- Live Map Status Badge -->
        <div class="map-status-overlay">
          <div class="map-control-pill">
            <span class="status-pulse"></span>
            <span>Campus Radar Active</span>
          </div>
        </div>

        <!-- Leaflet Map Container Root -->
        <div id="recommendationMap" role="region" aria-label="Campus Interactive Map"></div>
      </main>

    </div>

  </div>

  <!-- Toast Notification Container Root -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- Leaflet.js -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  
  <!-- Core Design System & Dashboard Scripts -->
  <script src="js/design-system.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
