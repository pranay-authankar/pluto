<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Room Partner Finder | Pluto</title>
  <meta name="description" content="Find verified student room partners and vacant shared rooms near campus.">

  <!-- Core Design System -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/roommates.css">
</head>
<body class="app-shell">

  <!-- TOP NAVIGATION BAR -->
  <header class="site-header">
    <div class="container header-container">
      
      <!-- Brand Logo -->
      <a href="index.html" class="brand" aria-label="Pluto Home">
        <div class="brand-icon-wrapper">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
            <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
          </svg>
        </div>
        <div class="brand-text">
          <span class="brand-title">Pluto</span>
          <span class="brand-tag">Your World Away From Home.</span>
        </div>
      </a>

      <!-- Quick Nav Links -->
      <div class="header-actions">
        <a href="index.html" class="nav-link">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="m15 18-6-6 6-6"/></svg>
          Home
        </a>
        <a href="rooms.html" class="nav-link">Rooms</a>
        <a href="food.html" class="nav-link">Food</a>
        <a href="nearby.html" class="nav-link">Nearby</a>
      </div>

    </div>
  </header>

  <!-- MAIN PARTNER FINDER SHELL -->
  <main class="main-content">
    <div class="roommates-page-shell">

      <!-- Header: Title & Subtitle -->
      <section class="roommates-header" style="margin-bottom: var(--space-5);">
        <div class="roommates-title-group">
          <h1 class="roommates-title">Room Partner Finder</h1>
          <span class="roommates-subtitle" id="roommatesCampusSubtitle">Connect with verified student peers and vacant shared room openings</span>
        </div>

        <div style="display: flex; align-items: center; gap: var(--space-2);">
          <span class="badge badge-secondary" id="badgeCollege" style="font-size: var(--font-size-xs);">🎓 Select College</span>
          <div class="badge badge-success" style="font-size: var(--font-size-xs);">
            <span class="badge-dot"></span> Student Verified
          </div>
        </div>
      </section>

      <!-- Landing Page: Two Choices -->
      <section class="roommate-choices-container" aria-label="Select your room search mode">
        <!-- Choice 1: I Have a Room -->
        <button type="button" class="choice-selector-card selected" id="choiceHaveRoom">
          <div class="choice-icon-wrap">
            <span>🏠</span>
          </div>
          <div class="choice-content">
            <span class="choice-tag">Host / Lease Holder</span>
            <span class="choice-title">I Have a Room</span>
            <span class="choice-desc">Find verified students looking for a room</span>
          </div>
          <div class="choice-radio-indicator"></div>
        </button>

        <!-- Choice 2: I Need a Room -->
        <button type="button" class="choice-selector-card" id="choiceNeedRoom">
          <div class="choice-icon-wrap">
            <span>🛏️</span>
          </div>
          <div class="choice-content">
            <span class="choice-tag">Seeking Accommodation</span>
            <span class="choice-title">I Need a Room</span>
            <span class="choice-desc">Find vacant shared rooms with someone already living there</span>
          </div>
          <div class="choice-radio-indicator"></div>
        </button>
      </section>

      <!-- Section Title & Status Bar -->
      <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--space-4); flex-wrap: wrap; gap: var(--space-3);">
        <div style="font-size: var(--font-size-sm); font-weight: 800; color: var(--slate-800); display: flex; align-items: center; gap: 8px;">
          <span id="activeSectionTitle">Students Seeking a Room</span>
          <span class="badge badge-secondary" id="activeCountBadge" style="font-size: 0.72rem; padding: 2px 8px;">6 available</span>
        </div>

        <div style="display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap;" id="quickFiltersBar">
          <!-- Quick filters injected by JS -->
        </div>
      </div>

      <!-- Clean Cards Grid -->
      <section class="roommates-grid" id="roommatesGrid" aria-label="Room Partner Grid">
        <!-- Rendered dynamically by js/roommates.js -->
      </section>

    </div>
  </main>

  <!-- DETAIL VIEW MODAL -->
  <div class="partner-modal-backdrop" id="partnerModal" role="dialog" aria-modal="true" aria-labelledby="modalName">
    <div class="partner-modal-card" id="modalCardContent">
      <!-- Injected by js/roommates.js -->
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/design-system.js"></script>
  <script src="js/roommates.js"></script>
</body>
</html>
